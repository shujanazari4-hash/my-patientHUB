<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPatientHUB - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="hero">

        <div class="welcome">
            <h1>Welcome to MyPatientHUB!</h1>
            <p>We provide smart healthcare services in your hands.</p>
        </div>

        <div class="login-box">

            <h2>Sign in to MyPatientHUB</h2>

            <div class="social-buttons">
                <button>f</button>
                <button>G</button>
            </div>

            <form id="loginForm">

                <input 
                    type="text" 
                    id="email"
                    placeholder="Email or Phone number"
                >

                <input 
                    type="password" 
                    id="password"
                    placeholder="Please enter your password"
                >

                <button type="submit" class="sign-in">
                    SIGN IN
                </button>

                <div class="options">
                    <a href="#">Forgot password?</a>

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>
                </div>

                <div class="or">
                    <span>or</span>
                </div>

                <button type="button" class="sign-up">
                    SIGN UP
                </button>

            </form>

        </div>

    </div>

    <footer>
        <a href="#">Google Play Store APP</a>
        <br>
        <a href="#">App Store APP</a>
        <br>
        <a href="#">About MyPatientHUB</a>
        <br>
        <a href="#"> About Us </a>
        <br>
        <a href="#">Our Blog</a>
        <br>
    </footer>

    <script src="script.js"></script>

</body>
</html>
